<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lgdNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="lgdGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lgdGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="lgdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Developer API Brackets -->
  <path d="M 68 152 C 48 152 36 164 36 200 V 256 C 36 266 28 272 16 272 C 28 272 36 278 36 288 V 344 C 36 380 48 392 68 392" 
        stroke="url(#lgdNavyGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#lgdGlow)" />
  <path d="M 444 152 C 464 152 476 164 476 200 V 256 C 476 266 484 272 496 272 C 484 272 476 278 476 288 V 344 C 476 380 464 392 444 392" 
        stroke="url(#lgdNavyGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#lgdGlow)" />

  <!-- Hierarchy Circuit Tracks / Branches -->
  <path d="M 256 180 V 270 M 140 270 H 372 M 140 270 V 310 M 256 270 V 310 M 372 270 V 310" 
        stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tier 1: Apex State Node (With Ashoka Core Accent) -->
  <rect x="186" y="90" width="140" height="90" rx="24" fill="url(#lgdNavyGrad)" stroke="#60a5fa" stroke-width="4" filter="url(#lgdGlow)" />
  <circle cx="256" cy="135" r="22" fill="#ffffff" />
  <circle cx="256" cy="135" r="9" fill="#1e3a8a" />

  <!-- Tier 2: District & Block Nodes -->
  <!-- Left District (Gold) -->
  <rect x="80" y="310" width="120" height="84" rx="20" fill="url(#lgdGoldGrad)" stroke="#fde047" stroke-width="3.5" filter="url(#lgdGlow)" />
  <circle cx="140" cy="352" r="14" fill="#ffffff" />
  <circle cx="140" cy="352" r="6" fill="#b45309" />

  <!-- Center Sub-District (Blue) -->
  <rect x="196" y="310" width="120" height="84" rx="20" fill="url(#lgdNavyGrad)" stroke="#93c5fd" stroke-width="3.5" filter="url(#lgdGlow)" />
  <circle cx="256" cy="352" r="14" fill="#ffffff" />
  <circle cx="256" cy="352" r="6" fill="#1e3a8a" />

  <!-- Right Block Node (Green) -->
  <rect x="312" y="310" width="120" height="84" rx="20" fill="url(#lgdGreenGrad)" stroke="#a7f3d0" stroke-width="3.5" filter="url(#lgdGlow)" />
  <circle cx="372" cy="352" r="14" fill="#ffffff" />
  <circle cx="372" cy="352" r="6" fill="#059669" />
</svg>
