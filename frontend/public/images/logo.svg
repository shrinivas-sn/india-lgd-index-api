<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lgdNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="lgdGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lgdGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="lgdShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Developer API Brackets on Sides -->
  <path d="M 48 140 C 28 140 16 152 16 188 V 244 C 16 254 8 260 -4 260 C 8 260 16 266 16 276 V 332 C 16 368 28 380 48 380" 
        stroke="url(#lgdNavyGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 464 140 C 484 140 496 152 496 188 V 244 C 496 254 504 260 516 260 C 504 260 496 266 496 276 V 332 C 496 368 484 380 464 380" 
        stroke="url(#lgdNavyGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- The Architectural Administrative Edifice (Fills Canvas) -->
  <g filter="url(#lgdShadow)">
    <!-- Pediment / Apex Roof -->
    <path d="M 40 180 L 256 44 L 472 180 Z" fill="url(#lgdNavyGrad)" stroke="#1e293b" stroke-width="4" />
    <rect x="32" y="180" width="448" height="32" rx="8" fill="#1e3a8a" />

    <!-- Center Ashoka Circle Accent -->
    <circle cx="256" cy="125" r="32" fill="#ffffff" />
    <circle cx="256" cy="125" r="16" fill="#0284c7" />

    <!-- 4 Tiers Governance Pillars -->
    <!-- Pillar 1: States (National/State Tier) -->
    <rect x="76" y="212" width="68" height="184" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
    <rect x="92" y="236" width="36" height="136" rx="8" fill="url(#lgdNavyGrad)" />

    <!-- Pillar 2: Districts -->
    <rect x="176" y="212" width="68" height="184" rx="14" fill="url(#lgdNavyGrad)" stroke="#1e293b" stroke-width="3" />
    <rect x="192" y="236" width="36" height="136" rx="8" fill="url(#lgdGoldGrad)" />

    <!-- Pillar 3: Sub-Districts -->
    <rect x="276" y="212" width="68" height="184" rx="14" fill="url(#lgdNavyGrad)" stroke="#1e293b" stroke-width="3" />
    <rect x="292" y="236" width="36" height="136" rx="8" fill="#38bdf8" />

    <!-- Pillar 4: Blocks / Villages -->
    <rect x="376" y="212" width="68" height="184" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
    <rect x="392" y="236" width="36" height="136" rx="8" fill="url(#lgdGreenGrad)" />

    <!-- Foundation Base Plinth (2 Solid Steps) -->
    <rect x="48" y="396" width="424" height="36" rx="10" fill="#1e293b" />
    <rect x="32" y="432" width="456" height="44" rx="14" fill="url(#lgdGreenGrad)" />
  </g>
</svg>
