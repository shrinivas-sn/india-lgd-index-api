<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="lgdNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="lgdGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lgdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Triangular Pediment / Roof Apex -->
  <path d="M3 22L32 5L61 22H3Z" fill="url(#lgdNavy)" />
  <rect x="2" y="22" width="60" height="4" rx="1" fill="#1e3a8a" />

  <!-- Center Ashoka Circle Accent in Pediment -->
  <circle cx="32" cy="15" r="4" fill="#ffffff" />
  <circle cx="32" cy="15" r="2" fill="#0284c7" />

  <!-- 4 Classical Administrative Tier Pillars -->
  <!-- Pillar 1: States -->
  <rect x="8" y="26" width="9" height="23" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <rect x="10" y="29" width="5" height="17" rx="1" fill="url(#lgdNavy)" />

  <!-- Pillar 2: Districts -->
  <rect x="21" y="26" width="9" height="23" rx="2" fill="url(#lgdNavy)" />
  <rect x="23" y="29" width="5" height="17" rx="1" fill="url(#lgdGold)" />

  <!-- Pillar 3: Sub-Districts -->
  <rect x="34" y="26" width="9" height="23" rx="2" fill="url(#lgdNavy)" />
  <rect x="36" y="29" width="5" height="17" rx="1" fill="#38bdf8" />

  <!-- Pillar 4: Blocks -->
  <rect x="47" y="26" width="9" height="23" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <rect x="49" y="29" width="5" height="17" rx="1" fill="url(#lgdGreen)" />

  <!-- Foundation Base Plinth -->
  <rect x="4" y="49" width="56" height="5" rx="1.5" fill="#1e293b" />
  <rect x="2" y="54" width="60" height="6" rx="2" fill="url(#lgdGreen)" />
</svg>
